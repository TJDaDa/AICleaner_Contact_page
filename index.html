<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Organize Contacts</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: #F8F9FD;
            color: #000000;
            line-height: 1.4;
        }

        .container {
            max-width: 375px;
            margin: 0 auto;
            background-color: #F8F9FD;
            min-height: 100vh;
            position: relative;
        }

        .header {
            display: flex;
            align-items: center;
            padding: 20px 16px 24px;
            border-bottom: 1px solid #f0f0f0;
        }

        .back-button {
            width: 24px;
            height: 24px;
            background: none;
            border: none;
            cursor: pointer;
            margin-right: 16px;
        }

        .back-arrow {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .title {
            font-size: 20px;
            font-weight: bold;
            color: #040404;
            flex: 1;
            text-align: center;
            margin-right: 40px; /* 平衡左侧按钮 */
        }

        .content {
            padding: 24px 16px;
        }

        .contact-item {
            display: flex;
            align-items: center;
            height: 69px;
            padding: 0 16px;
            margin-bottom: 14px;
            background-color: #ffffff;
            border-radius: 12px;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .contact-item:last-child {
            margin-bottom: 0;
        }

        .contact-item:hover {
            background-color: #f8f8f8;
        }

        .icon {
            width: 42px;
            height: 42px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 16px;
            position: relative;
        }

        .icon.duplicate {
            background-color: transparent;
        }

        .icon.incomplete {
            background-color: transparent;
        }

        .icon.all {
            background-color: transparent;
        }

        .icon.backup {
            background-color: transparent;
        }

        .icon-symbol {
            width: 42px;
            height: 42px;
            position: relative;
        }

        .icon-image {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        /* 响应式图片支持 */
        @media (-webkit-min-device-pixel-ratio: 3), (min-resolution: 288dpi) {
            .icon-image[src*="@2x"] {
                content: attr(data-src-3x);
            }
        }

        @media (-webkit-min-device-pixel-ratio: 2), (min-resolution: 192dpi) {
            .icon-image[src*="@2x"] {
                content: attr(data-src-2x);
            }
        }

        .item-text {
            flex: 1;
            font-size: 18px;
            color: #040404;
            font-weight: 500;
        }

        .item-count {
            font-size: 16px;
            color: #040404;
            font-weight: 400;
            margin-right: 8px;
        }

        .arrow {
            width: 8px;
            height: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .arrow-image {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .home-indicator {
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 134px;
            height: 5px;
            background-color: #000000;
            border-radius: 3px;
            margin-bottom: 8px;
        }

        @media (max-width: 375px) {
            .container {
                max-width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <button class="back-button">
                <img src="image/back icon.png" 
                     data-src-2x="image/back icon@2x.png"
                     data-src-3x="image/back icon@3x.png"
                     alt="Back" class="back-arrow">
            </button>
            <h1 class="title">Organize Contacts</h1>
        </div>

        <div class="content">
            <div class="contact-item">
                <div class="icon duplicate">
                    <div class="icon-symbol">
                        <img src="image/Duplicate Contacts icon.png" 
                             data-src-2x="image/Duplicate Contacts icon@2x.png"
                             data-src-3x="image/Duplicate Contacts icon@3x.png"
                             alt="Duplicate Contacts" class="icon-image">
                    </div>
                </div>
                <div class="item-text">Duplicate Contacts</div>
                <div class="item-count">52</div>
                <div class="arrow">
                    <img src="image/next icon.png" 
                         data-src-2x="image/next icon@2x.png"
                         data-src-3x="image/next icon@3x.png"
                         alt="Next" class="arrow-image">
                </div>
            </div>

            <div class="contact-item">
                <div class="icon incomplete">
                    <div class="icon-symbol">
                        <img src="image/Incomplete Contacts icon.png" 
                             data-src-2x="image/Incomplete Contacts icon@2x.png"
                             data-src-3x="image/Incomplete Contacts icon@3x.png"
                             alt="Incomplete Contacts" class="icon-image">
                    </div>
                </div>
                <div class="item-text">Incomplete Contacts</div>
                <div class="item-count">0</div>
                <div class="arrow">
                    <img src="image/next icon.png" 
                         data-src-2x="image/next icon@2x.png"
                         data-src-3x="image/next icon@3x.png"
                         alt="Next" class="arrow-image">
                </div>
            </div>

            <div class="contact-item">
                <div class="icon all">
                    <div class="icon-symbol">
                        <img src="image/All Contacts icon.png" 
                             data-src-2x="image/All Contacts icon@2x.png"
                             data-src-3x="image/All Contacts icon@3x.png"
                             alt="All Contacts" class="icon-image">
                    </div>
                </div>
                <div class="item-text">All Contacts</div>
                <div class="item-count">522</div>
                <div class="arrow">
                    <img src="image/next icon.png" 
                         data-src-2x="image/next icon@2x.png"
                         data-src-3x="image/next icon@3x.png"
                         alt="Next" class="arrow-image">
                </div>
            </div>

            <div class="contact-item">
                <div class="icon backup">
                    <div class="icon-symbol">
                        <img src="image/Back Up Contacts icon.png" 
                             data-src-2x="image/Back Up Contacts icon@2x.png"
                             data-src-3x="image/Back Up Contacts icon@3x.png"
                             alt="Back Up Contacts" class="icon-image">
                    </div>
                </div>
                <div class="item-text">Back Up Contacts</div>
                <div class="item-count">0</div>
                <div class="arrow">
                    <img src="image/next icon.png" 
                         data-src-2x="image/next icon@2x.png"
                         data-src-3x="image/next icon@3x.png"
                         alt="Next" class="arrow-image">
                </div>
            </div>
        </div>

        <div class="home-indicator"></div>
    </div>

    <script>
        // 动态加载合适分辨率的图片
        function loadResponsiveImages() {
            const pixelRatio = window.devicePixelRatio || 1;
            const images = document.querySelectorAll('img[data-src-2x]');
            
            images.forEach(img => {
                let src = img.src;
                
                if (pixelRatio >= 3 && img.dataset.src3x) {
                    src = img.dataset.src3x;
                } else if (pixelRatio >= 2 && img.dataset.src2x) {
                    src = img.dataset.src2x;
                }
                
                if (src !== img.src) {
                    img.src = src;
                }
            });
        }

        // 页面加载完成后执行
        document.addEventListener('DOMContentLoaded', function() {
            loadResponsiveImages();
            
            // 添加点击事件处理
            document.querySelectorAll('.contact-item').forEach(item => {
                item.addEventListener('click', function() {
                    const text = this.querySelector('.item-text').textContent;
                    alert(`点击了: ${text}`);
                });
            });

            // 返回按钮事件
            document.querySelector('.back-button').addEventListener('click', function() {
                alert('返回上一页');
            });
        });
    </script>
</body>
</html>
